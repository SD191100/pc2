services:
  # ===========================================
  # PostgreSQL Database
  # ===========================================
  postgres:
    image: postgres:16-alpine
    container_name: pc2-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-dev}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-dev}
      POSTGRES_DB: ${POSTGRES_DB:-compute_db}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-dev} -d ${POSTGRES_DB:-compute_db}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - pc2-network

  # ===========================================
  # Garage Secret Init - Creates RPC secret file
  # ===========================================
  garage-secret:
    image: alpine:latest
    container_name: pc2-garage-secret
    volumes:
      - garage_meta:/var/lib/garage/meta
    command:
      - sh
      - -c
      - |
        if [ ! -f /var/lib/garage/meta/.rpc_secret ]; then
          head -c 32 /dev/urandom | xxd -p -c 64 > /var/lib/garage/meta/.rpc_secret
          chmod 600 /var/lib/garage/meta/.rpc_secret
          echo "RPC secret created with mode 600"
        else
          chmod 600 /var/lib/garage/meta/.rpc_secret
          echo "RPC secret already exists, fixed permissions"
        fi
    networks:
      - pc2-network

  # ===========================================
  # Garage - S3 Compatible Storage (Pulumi State)
  # ===========================================
  garage:
    image: dxflrs/garage:v1.0.1
    container_name: pc2-garage
    restart: unless-stopped
    depends_on:
      garage-secret:
        condition: service_completed_successfully
    ports:
      - "${GARAGE_API_PORT:-3900}:3900"
      - "${GARAGE_RPC_PORT:-3901}:3901"
      - "${GARAGE_ADMIN_PORT:-3903}:3903"
    volumes:
      - garage_data:/var/lib/garage/data
      - garage_meta:/var/lib/garage/meta
      - ./garage.toml:/etc/garage.toml:ro
    environment:
      GARAGE_CONFIG_FILE: /etc/garage.toml
    networks:
      - pc2-network

  # ===========================================
  # Garage Init - Initializes Garage on first run
  # ===========================================
  garage-init:
    image: curlimages/curl:latest
    container_name: pc2-garage-init
    depends_on:
      garage:
        condition: service_started
    volumes:
      - ./.env:/host-env:rw
    entrypoint: /bin/sh
    command:
      - -c
      - |
        echo "=== Garage Initialization ==="
        sleep 10
        
        AUTH="Authorization: Bearer pc2-garage-admin-token"
        
        # Get node ID (from "node" field in status response)
        NODE_ID=$$(curl -sf -H "$$AUTH" http://garage:3903/v1/status | grep -o '"node":"[^"]*"' | cut -d'"' -f4)
        echo "Node ID: $$NODE_ID"
        
        if [ -z "$$NODE_ID" ]; then
          echo "ERROR: Could not get node ID"
          exit 1
        fi
        
        # Configure layout
        curl -sf -X POST -H "$$AUTH" -H "Content-Type: application/json" \
          http://garage:3903/v1/layout \
          -d "{\"$$NODE_ID\": {\"zone\": \"dc1\", \"capacity\": 1073741824, \"tags\": [\"pc2\"]}}" || true
        
        # Apply layout
        VERSION=$$(curl -sf -H "$$AUTH" http://garage:3903/v1/layout | grep -o '"version":[0-9]*' | cut -d':' -f2)
        NEW_VERSION=$$((VERSION + 1))
        curl -sf -X POST -H "$$AUTH" -H "Content-Type: application/json" \
          http://garage:3903/v1/layout/apply \
          -d "{\"version\": $$NEW_VERSION}" || true
        
        echo "Layout configured!"
        
        # Check if credentials already exist in .env
        if grep -q "AWS_ACCESS_KEY_ID=GK" /host-env 2>/dev/null; then
          echo "Credentials already exist in .env, skipping key creation"
          grep "AWS_ACCESS_KEY_ID\|AWS_SECRET_ACCESS_KEY" /host-env
        else
          echo "Creating access key..."
          KEY_RESPONSE=$$(curl -sf -X POST -H "$$AUTH" -H "Content-Type: application/json" \
            http://garage:3903/v1/key \
            -d '{"name": "pc2-pulumi"}')
          
          ACCESS_KEY=$$(echo "$$KEY_RESPONSE" | grep -o '"accessKeyId":"[^"]*"' | cut -d'"' -f4)
          SECRET_KEY=$$(echo "$$KEY_RESPONSE" | grep -o '"secretAccessKey":"[^"]*"' | cut -d'"' -f4)
          
          if [ -n "$$ACCESS_KEY" ]; then
            echo "Creating bucket..."
            BUCKET_RESPONSE=$$(curl -sf -X POST -H "$$AUTH" -H "Content-Type: application/json" \
              http://garage:3903/v1/bucket \
              -d '{"globalAlias": "pulumi-state"}')
            
            BUCKET_ID=$$(echo "$$BUCKET_RESPONSE" | grep -o '"id":"[^"]*"' | cut -d'"' -f4)
            
            if [ -n "$$BUCKET_ID" ]; then
              echo "Granting bucket access..."
              curl -sf -X POST -H "$$AUTH" -H "Content-Type: application/json" \
                http://garage:3903/v1/bucket/allow \
                -d "{\"bucketId\": \"$$BUCKET_ID\", \"accessKeyId\": \"$$ACCESS_KEY\", \"permissions\": {\"read\": true, \"write\": true, \"owner\": true}}"
            fi
            
            # Update .env file with new credentials
            sed -i "s|^AWS_ACCESS_KEY_ID=.*|AWS_ACCESS_KEY_ID=$$ACCESS_KEY|" /host-env
            sed -i "s|^AWS_SECRET_ACCESS_KEY=.*|AWS_SECRET_ACCESS_KEY=$$SECRET_KEY|" /host-env
            
            echo ""
            echo "=========================================="
            echo "GARAGE CREDENTIALS (updated in .env)"
            echo "=========================================="
            echo "AWS_ACCESS_KEY_ID=$$ACCESS_KEY"
            echo "AWS_SECRET_ACCESS_KEY=$$SECRET_KEY"
            echo "=========================================="
          fi
        fi
        
        echo "=== Garage initialization complete! ==="
    networks:
      - pc2-network

  # ===========================================
  # PC2 Backend API
  # ===========================================
  pc2-api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: pc2-api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      garage-init:
        condition: service_completed_successfully
    environment:
      PORT: 8000
      NODE_ENV: ${NODE_ENV:-development}
      LOG_LEVEL: ${LOG_LEVEL:-debug}
      # Pulumi Secrets
      PULUMI_CONFIG_PASSPHRASE: ${PULUMI_CONFIG_PASSPHRASE:-password}
      # Database - Direct PostgreSQL connection for Docker
      DATABASE_URL: postgresql://${POSTGRES_USER:-dev}:${POSTGRES_PASSWORD:-dev}@postgres:5432/${POSTGRES_DB:-compute_db}
      # Pulumi S3 Backend (Garage)
      PULUMI_BACKEND_URL: s3://pulumi-state?endpoint=http://garage:3900&disableSSL=true&s3ForcePathStyle=true&region=garage
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY}
      AWS_REGION: garage
      # Proxmox settings
      PROXMOX_ENDPOINT: ${PROXMOX_ENDPOINT}
      PROXMOX_API_TOKEN_ID: ${PROXMOX_API_TOKEN_ID}
      PROXMOX_API_TOKEN_SECRET: ${PROXMOX_API_TOKEN_SECRET}
      PROXMOX_NODE: ${PROXMOX_NODE}
      PROXMOX_TEMPLATE_VM_ID: ${PROXMOX_TEMPLATE_VM_ID}
      PROXMOX_DATASTORE_ID: ${PROXMOX_DATASTORE_ID}
      PROXMOX_SSH_USERNAME: ${PROXMOX_SSH_USERNAME:-root}
      PROXMOX_SSH_PRIVATE_KEY: ${PROXMOX_SSH_PRIVATE_KEY}
      PROXMOX_SSL_VERIFY: ${PROXMOX_SSL_VERIFY:-false}
      ADVISORY_LOCK_ID: ${ADVISORY_LOCK_ID:-9876543210}
      # CORS - Allow frontend to access API
      CORS_ORIGIN: ${CORS_ORIGIN:-*}
    ports:
      - "${PC2_API_PORT:-8000}:8000"
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:8000', (res) => { process.exit(res.statusCode === 200 ? 0 : 1) })"]
      interval: 30s
      timeout: 3s
      start_period: 10s
      retries: 3
    networks:
      - pc2-network

  # ===========================================
  # PC2 Web Frontend
  # ===========================================
  pc2-web:
    build:
      context: ../pc2-web
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_BASE_URL: http://localhost:${PC2_API_PORT:-8000}
    container_name: pc2-web
    restart: unless-stopped
    depends_on:
      pc2-api:
        condition: service_healthy
    environment:
      PORT: 3000
      NEXT_PUBLIC_API_BASE_URL: http://localhost:${PC2_API_PORT:-8000}
      NEXT_PUBLIC_VALID_TOKEN: ${NEXT_PUBLIC_VALID_TOKEN:-MOCK_TOKEN_ABC}
    ports:
      - "${PC2_WEB_PORT:-3000}:3000"
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000"]
      interval: 30s
      timeout: 10s
      start_period: 30s
      retries: 3
    networks:
      - pc2-network

# ===========================================
# Networks
# ===========================================
networks:
  pc2-network:
    driver: bridge
    name: pc2-network

# ===========================================
# Volumes
# ===========================================
volumes:
  postgres_data:
    name: pc2-postgres-data
  garage_data:
    name: pc2-garage-data
  garage_meta:
    name: pc2-garage-meta
